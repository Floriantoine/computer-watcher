appId: io.github.floriantoine.procwatch
productName: proc-watch
directories:
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
linux:
  icon: build/icons
  target:
    - AppImage
    - deb
  category: System
  executableName: proc-watch
  synopsis: Voir et tuer les processus gourmands
artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
  releaseType: release
